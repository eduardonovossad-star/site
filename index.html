<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="Card"><h1 id="title">Login|Biblion </h1>
    <input type="text" placeholder="Digite o código" id="verificar">
    <span id="erro" style="color: red;"></span>
    <details id="oculto" style="display: none;">
        <summary>Verificar Código</summary>
        <p>o código é: "leia"</p>
    </details>
</div>
</body>
<script>
const verify = document.getElementById("verificar");
const erro = document.getElementById("erro");
const oculto = document.getElementById("oculto");
let tenta = 0;
verify.onblur = function(event){
tenta++;
  text = event.target.value

  if (text === "leia"){
    window.location.href = "start.html"
  }else{
    erro.textContent = "Código errado seu betinha"
   
   /*setTimeout(() => {
    window.location.reload()
   },2000);*/
}
if(tenta >= 3){
    oculto.style.display = "block";
}
}
</script>
</html>
