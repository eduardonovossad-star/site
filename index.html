            width: 300px;
            padding: 20px;
            background: rgb(255, 252, 252);
            border-radius: 10px;
            position: fixed;
            top: 50%;
            left: 50%;

            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.974);
